<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forgot Password · Calmora </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6FB;
    --surface:#FFFFFF;
    --ink:#2B2140;
    --ink-soft:#6B5F82;
    --teal:#6C3FC9;
    --teal-dark:#4B2A94;
    --sage:#B79CE8;
    --sage-soft:#F0E9FB;
    --coral:#E0457B;
    --coral-soft:#FCE7EF;
    --amber:#F2B705;
    --amber-soft:#FDF0CC;
    --line:#E7DFF2;
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    min-height:100svh;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    position:relative;
    overflow-x:hidden;
  }
  a{ text-decoration:none; }
  a:focus-visible, button:focus-visible, input:focus-visible{ outline:3px solid var(--sage); outline-offset:2px; }

  .bg-shape{ position:fixed; border-radius:50%; z-index:0; opacity:.55; pointer-events:none; }
  .bg-shape.s1{ width:420px; height:420px; background:radial-gradient(circle at 30% 30%, var(--sage-soft), transparent 70%); top:-140px; left:-140px; }
  .bg-shape.s2{ width:360px; height:360px; background:radial-gradient(circle at 60% 40%, var(--amber-soft), transparent 70%); bottom:-120px; right:-100px; }

  .container{
    position:relative; z-index:1;
    width:100%; max-width:420px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:22px;
    padding:40px 36px;
    box-shadow:0 30px 60px -30px rgba(75,42,148,.4);
  }

  .icon{
    width:56px; height:56px; margin:0 auto 20px;
    border-radius:16px;
    background:var(--sage-soft);
    display:flex; align-items:center; justify-content:center;
    flex:none;
  }
  .icon svg{ width:26px; height:26px; stroke:var(--teal); }

  h2{
    font-family:'Fraunces',serif; font-weight:600; font-size:clamp(19px,5vw,23px);
    text-align:center; margin:0 0 8px; color:var(--teal-dark);
  }
  .description{
    text-align:center; color:var(--ink-soft); font-size:14px;
    line-height:1.55; margin:0 0 26px;
  }

  .message{
    display:flex; align-items:center; gap:9px;
    background:var(--amber-soft); color:#8a6e00;
    border-radius:10px; padding:11px 13px; font-size:13px; font-weight:500;
    margin-bottom:18px;
    word-break:break-word;
  }
  .message svg{ width:15px; height:15px; stroke:#8a6e00; flex:none; }

  .field{ margin-bottom:6px; }
  .field label{
    display:block; font-size:13px; font-weight:600; color:var(--ink);
    margin-bottom:7px;
  }
  .input-wrap{ position:relative; }
  .input-wrap svg.leading{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; stroke:var(--ink-soft); pointer-events:none;
  }
  input[type="email"]{
    width:100%; font-family:inherit; font-size:16px; color:var(--ink);
    background:#fff; border:1.5px solid var(--line); border-radius:12px;
    padding:12px 14px 12px 40px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:hover{ border-color:var(--sage); }
  input:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 4px var(--sage-soft); }

  .field.error input{ border-color:var(--coral); }
  .field.error input:focus{ box-shadow:0 0 0 4px var(--coral-soft); }
  .error-msg{
    display:none; align-items:center; gap:6px;
    font-size:12.5px; color:var(--coral); margin-top:7px; font-weight:500;
  }
  .field.error .error-msg{ display:flex; }
  .error-msg svg{ width:13px; height:13px; stroke:var(--coral); flex:none; }

  button[type="submit"]{
    width:100%; margin-top:22px; font-family:inherit; font-size:14.5px; font-weight:600; color:#fff;
    background:linear-gradient(135deg,var(--teal),var(--teal-dark));
    padding:13px 18px; border-radius:12px; border:none; cursor:pointer;
    box-shadow:0 10px 24px -12px rgba(75,42,148,.55);
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  button[type="submit"]:hover{ transform:translateY(-1px); box-shadow:0 14px 28px -12px rgba(75,42,148,.65); }
  button[type="submit"]:disabled{ opacity:.7; cursor:not-allowed; transform:none; }
  button[type="submit"] .spinner{
    width:15px; height:15px; border-radius:50%;
    border:2px solid rgba(255,255,255,.4); border-top-color:#fff;
    display:none; animation:spin .7s linear infinite; flex:none;
  }
  button[type="submit"].loading .spinner{ display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .back-login{ text-align:center; margin-top:22px; }
  .back-login a{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--teal); font-size:13.5px; font-weight:600;
  }
  .back-login a svg{ width:14px; height:14px; stroke:currentColor; flex:none; }
  .back-login a:hover{ color:var(--teal-dark); text-decoration:underline; }

  /* ---------- Responsive breakpoints ---------- */
  @media (max-width:520px){
    .bg-shape{ opacity:.35; }
  }

  @media (max-width:480px){
    .container{ padding:32px 24px; border-radius:18px; }
    .icon{ width:50px; height:50px; border-radius:14px; margin-bottom:16px; }
    .icon svg{ width:22px; height:22px; }
    .description{ font-size:13.5px; margin-bottom:22px; }
  }

  @media (max-width:360px){
    body{ padding-left:14px; padding-right:14px; }
    .container{ padding:26px 18px; }
    input[type="email"]{ padding-left:36px; }
    .input-wrap svg.leading{ left:12px; width:15px; height:15px; }
  }

  @media (max-height:640px) and (max-width:480px){
    .icon{ margin-bottom:12px; }
    .description{ margin-bottom:16px; }
    button[type="submit"]{ margin-top:16px; }
    .back-login{ margin-top:16px; }
  }

  @media (prefers-reduced-motion:reduce){
    button[type="submit"], input, .spinner{ transition:none; animation:none; }
  }
</style>
</head>
<body>

  <span class="bg-shape s1"></span>
  <span class="bg-shape s2"></span>

  <div class="container">

    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>

    <h2>Forgot password?</h2>
    <p class="description">Enter your registered email address and we'll send you a new password.</p>

    {% if messages %}
      {% for message in messages %}
        <div class="message">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
          <span>{{ message }}</span>
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST" action="/myapp/forgetpass_post/" id="forgotForm" novalidate>
      {% csrf_token %}

      <div class="field" id="emailField">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <svg class="leading" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          <input type="email" id="email" name="email" placeholder="Enter your registered email">
        </div>
        <div class="error-msg">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
          Please enter a valid email address.
        </div>
      </div>

      <button type="submit" id="submitBtn">
        <span class="spinner"></span>
        <span class="btn-label">Reset password</span>
      </button>
    </form>

    <div class="back-login">
      <a href="/myapp/login_get/">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to login
      </a>
    </div>

  </div>

<script>
(function(){
  const form = document.getElementById('forgotForm');
  const email = document.getElementById('email');
  const submitBtn = document.getElementById('submitBtn');

  function isValidEmail(v){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
  }

  function validateEmail(){
    const ok = isValidEmail(email.value);
    document.getElementById('emailField').classList.toggle('error', !ok);
    return ok;
  }

  email.addEventListener('input', validateEmail);

  form.addEventListener('submit', function(e){
    if(!validateEmail()){
      e.preventDefault();
      email.focus();
      return;
    }
    submitBtn.classList.add('loading');
    submitBtn.disabled = true;
    submitBtn.querySelector('.btn-label').textContent = 'Sending...';
  });
})();
</script>

</body>
</html>
