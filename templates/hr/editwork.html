<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit Work · Calmora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6FB;
    --surface:#FFFFFF;
    --ink:#2B2140;
    --ink-soft:#6B5F82;
    --teal:#6C3FC9;
    --teal-dark:#4B2A94;
    --sage:#B79CE8;
    --sage-soft:#F0E9FB;
    --coral:#E0457B;
    --coral-soft:#FCE7EF;
    --line:#E7DFF2;
    --ok:#1FB6A6;
    --ok-soft:#DBF6F1;
    --radius:16px;
    --navbar-h:64px;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:var(--navbar-h);}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(600px 300px at 90% -10%, var(--sage-soft), transparent),
      radial-gradient(500px 260px at -10% 110%, #FDF0CC, transparent),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:var(--navbar-h);
  }
  a{color:inherit; text-decoration:none;}
  a:focus-visible, button:focus-visible{outline:3px solid var(--sage); outline-offset:2px;}

  /* ---------- Nav bar ---------- */
  .navbar{
    background:var(--surface); border-bottom:1px solid var(--line);
    position:fixed; top:0; left:0; right:0; width:100%; height:var(--navbar-h); z-index:30;
  }
  .nav-inner{
    max-width:960px; margin:0 auto; padding:0 20px;
    height:var(--navbar-h); display:flex; align-items:center; gap:20px;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; color:var(--teal-dark); flex:none; }
  .brand-mark{
    width:26px;height:26px;border-radius:8px;
    background:linear-gradient(135deg,var(--teal),var(--sage));
    display:flex;align-items:center;justify-content:center;
  }
  .brand-mark svg{width:14px;height:14px;stroke:#fff;}

  .nav-links{ display:flex; align-items:center; gap:4px; flex:1; overflow-x:auto; scrollbar-width:none; }
  .nav-links::-webkit-scrollbar{ display:none; }
  .nav-links a{
    display:flex; align-items:center; gap:7px;
    font-size:13.5px; font-weight:600; color:var(--ink-soft);
    padding:8px 13px; border-radius:999px; white-space:nowrap;
    transition:background .15s ease, color .15s ease;
  }
  .nav-links a svg{ width:14px;height:14px; stroke:currentColor; flex:none; }
  .nav-links a:hover, .nav-links a.active{ background:var(--sage-soft); color:var(--teal-dark); }

  .nav-toggle{
    display:none; flex:none;
    width:36px;height:36px; border-radius:10px; border:1px solid var(--line);
    background:#fff; align-items:center; justify-content:center; cursor:pointer;
  }
  .nav-toggle svg{ width:17px;height:17px; stroke:var(--ink); }

  .nav-drawer{ display:none; }
  @media (max-width:720px){
    .nav-links{ display:none; }
    .nav-toggle{ display:flex; }
    .nav-drawer{
      display:none; flex-direction:column;
      max-width:960px; margin:0 auto; padding:0 20px 14px; gap:2px;
      position:fixed; top:64px; left:0; right:0;
      background:var(--surface); border-bottom:1px solid var(--line);
      max-height:calc(100vh - 64px); overflow-y:auto;
    }
    .nav-drawer.open{ display:flex; }
    .nav-drawer a{
      display:flex; align-items:center; gap:10px;
      font-size:14.5px; font-weight:600; color:var(--ink);
      padding:11px 12px; border-radius:11px;
    }
    .nav-drawer a svg{ width:16px;height:16px; stroke:var(--teal); flex:none; }
    .nav-drawer a:hover, .nav-drawer a.active{ background:var(--sage-soft); }
  }

  .wrap{ max-width:600px; margin:0 auto; padding:28px 20px 60px; }

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:22px;
    padding:36px 32px 32px;
    box-shadow:0 24px 48px -28px rgba(75,42,148,.28);
  }
  @media (max-width:520px){ .panel{ padding:28px 20px 24px; border-radius:18px; } }

  .panel-head{ margin-bottom:26px; }
  .panel-head .eyebrow{
    display:inline-block; font-size:12px; font-weight:600; letter-spacing:.04em;
    text-transform:uppercase; color:var(--teal); background:var(--sage-soft);
    padding:4px 10px; border-radius:999px; margin-bottom:12px;
  }
  .panel-head h1{
    font-family:'Fraunces',serif; font-weight:600; font-size:26px;
    margin:0 0 6px; color:var(--teal-dark);
  }
  .panel-head p{ margin:0; font-size:14px; color:var(--ink-soft); line-height:1.5; }

  form{ display:flex; flex-direction:column; gap:18px; }

  .row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:520px){ .row{ grid-template-columns:1fr; } }

  .field{ position:relative; display:flex; flex-direction:column; }
  .field label{ font-size:13px; font-weight:600; color:var(--ink); margin-bottom:7px; }
  .field label .req{ color:var(--coral); margin-left:2px; }
  .field label .char-count{
    float:right; font-weight:500; color:var(--ink-soft); font-size:12px;
  }

  .field input,
  .field textarea{
    width:100%;
    font-family:inherit; font-size:14.5px; color:var(--ink);
    background:#FBF9FD;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
    appearance:none;
  }
  .field textarea{ resize:vertical; min-height:110px; line-height:1.55; font-family:inherit; }

  .field input:hover, .field textarea:hover{ border-color:var(--sage); }
  .field input:focus, .field textarea:focus{
    outline:none; border-color:var(--teal); background:#fff;
    box-shadow:0 0 0 4px var(--sage-soft);
  }

  .field.error input, .field.error textarea{
    border-color:var(--coral); background:var(--coral-soft);
  }
  .field.error input:focus, .field.error textarea:focus{
    box-shadow:0 0 0 4px var(--coral-soft);
  }
  .field.valid input, .field.valid textarea{ border-color:var(--ok); }

  .hint{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; }
  .error-msg{
    font-size:12.5px; color:var(--coral); margin-top:6px; font-weight:500;
    display:none; align-items:center; gap:5px;
  }
  .field.error .error-msg{ display:flex; }
  .error-msg svg{ width:13px;height:13px; stroke:var(--coral); flex:none; }

  .submit-row{ display:flex; align-items:center; gap:14px; margin-top:8px; flex-wrap:wrap; }
  button[type="submit"]{
    font-family:inherit; font-weight:600; font-size:15px; color:#fff;
    background:linear-gradient(135deg,var(--teal),var(--teal-dark));
    border:none; border-radius:12px; padding:13px 26px;
    cursor:pointer; display:inline-flex; align-items:center; gap:8px;
    box-shadow:0 12px 24px -10px rgba(75,42,148,.55);
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  button[type="submit"]:hover{ transform:translateY(-2px); box-shadow:0 16px 30px -10px rgba(75,42,148,.6); }
  button[type="submit"]:active{ transform:translateY(0); }
  button[type="submit"] svg{ width:16px;height:16px; stroke:#fff; }
  .form-status{ font-size:13px; color:var(--coral); font-weight:600; }
</style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <div class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c2-4 4-6 6-6s3 8 6 8 4-6 6-6"/></svg>
        </span>
        Calmora
      </div>

      <div class="nav-links">
        <a href="/myapp/hrhome_get/">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
          Dashboard
        </a>
        <a href="/myapp/viewteamleader_get/">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5"/><path d="M9 4.5l3 3 3-3"/></svg>
          Team leaders
        </a>
        <a href="/myapp/viewteammember_get/">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Team members
        </a>
        <a href="/myapp/hrviewwork_get/" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-6 3 4 5-8"/></svg>
          Work
        </a>
      </div>

      <button type="button" class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>

    <div class="nav-drawer" id="navDrawer">
      <a href="/myapp/hrhome_get/">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
        Dashboard
      </a>
      <a href="/myapp/viewteamleader_get/">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5"/><path d="M9 4.5l3 3 3-3"/></svg>
        Team leaders
      </a>
      <a href="/myapp/viewteammember_get/">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Team members
      </a>
      <a href="/myapp/hrviewwork_get/" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-6 3 4 5-8"/></svg>
        Work
      </a>
    </div>
  </nav>

  <div class="wrap">
    <div class="panel">
      <div class="panel-head">
        <span class="eyebrow">HR · Work</span>
        <h1>Edit work</h1>
        <p>Update the details below and save your changes.</p>
      </div>

      <form action="/myapp/editwork_post/" method="post" id="workForm" novalidate>
        {% csrf_token %}
        <input type="hidden" name="id" value="{{ data.id }}">

        <div class="row">
          <div class="field" data-field="date">
            <label for="date">Date<span class="req">*</span></label>
            <input type="date" id="date" name="date" value="{{ data.date|date:'Y-m-d' }}">
            <span class="error-msg"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><span class="msg-text">Please choose a date.</span></span>
          </div>
          <div class="field" data-field="deadline">
            <label for="deadline">Deadline<span class="req">*</span></label>
            <input type="date" id="deadline" name="deadline" value="{{ data.deadline|date:'Y-m-d' }}">
            <span class="error-msg"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><span class="msg-text">Deadline must be on or after the date.</span></span>
          </div>
        </div>

        <div class="field" data-field="worktitle">
          <label for="worktitle">Work title<span class="req">*</span></label>
          <input type="text" id="worktitle" name="worktitle" value="{{ data.worktitle }}" placeholder="e.g. Q3 client presentation">
          <span class="error-msg"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><span class="msg-text">Please enter a work title.</span></span>
        </div>

        <div class="field" data-field="workdescription">
          <label for="work_description">Work description<span class="req">*</span> <span class="char-count" id="charCount">0 / 500</span></label>
          <textarea id="work_description" name="work_description" placeholder="Describe what needs to be done..." maxlength="500">{{ data.work_description }}</textarea>
          <span class="error-msg"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><span class="msg-text">Please add a short description.</span></span>
        </div>

        <div class="submit-row">
          <button type="submit">
            Save changes
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
          <span class="form-status" id="formStatus"></span>
        </div>
      </form>
    </div>
  </div>

<script>
(function(){
  const navToggle = document.getElementById('navToggle');
  const navDrawer = document.getElementById('navDrawer');
  if(navToggle && navDrawer){
    navToggle.addEventListener('click', function(){
      const open = navDrawer.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }

  const form = document.getElementById('workForm');
  const status = document.getElementById('formStatus');
  const desc = document.getElementById('work_description');
  const charCount = document.getElementById('charCount');

  if(desc && charCount){
    charCount.textContent = desc.value.length + ' / 500';
    desc.addEventListener('input', function(){
      charCount.textContent = desc.value.length + ' / 500';
    });
  }

  function setError(fieldEl, isError, customMsg){
    fieldEl.classList.toggle('error', isError);
    fieldEl.classList.toggle('valid', !isError);
    if(isError && customMsg){
      const msg = fieldEl.querySelector('.msg-text');
      if(msg) msg.textContent = customMsg;
    }
  }

  function validators(){
    const date = document.getElementById('date');
    const deadline = document.getElementById('deadline');
    const worktitle = document.getElementById('worktitle');
    const workdescription = document.getElementById('work_description');

    return [
      { el: date, field: date.closest('.field'),
        test: () => date.value !== '' },
      { el: deadline, field: deadline.closest('.field'),
        test: () => {
          if(!deadline.value) return false;
          if(!date.value) return true; // date error will already show
          return new Date(deadline.value) >= new Date(date.value);
        } },
      { el: worktitle, field: worktitle.closest('.field'),
        test: () => worktitle.value.trim().length >= 3 },
      { el: workdescription, field: workdescription.closest('.field'),
        test: () => workdescription.value.trim().length >= 5 },
    ];
  }

  validators().forEach(v => {
    const run = () => setError(v.field, !v.test());
    v.el.addEventListener('blur', run);
    v.el.addEventListener('input', () => { if(v.field.classList.contains('error')) run(); });
    v.el.addEventListener('change', () => { if(v.field.classList.contains('error')) run(); });
  });

  // Re-validate deadline whenever date changes
  document.getElementById('date').addEventListener('change', function(){
    const deadlineField = document.getElementById('deadline').closest('.field');
    if(deadlineField.classList.contains('error') || deadlineField.classList.contains('valid')){
      const deadlineValidator = validators().find(v => v.el.id === 'deadline');
      setError(deadlineField, !deadlineValidator.test());
    }
  });

  form.addEventListener('submit', function(e){
    const checks = validators();
    let firstInvalid = null;
    let anyInvalid = false;

    checks.forEach(v => {
      const ok = v.test();
      setError(v.field, !ok);
      if(!ok){
        anyInvalid = true;
        if(!firstInvalid) firstInvalid = v.el;
      }
    });

    if(anyInvalid){
      e.preventDefault();
      status.textContent = 'Please fix the highlighted fields.';
      if(firstInvalid){
        firstInvalid.scrollIntoView({ behavior:'smooth', block:'center' });
        firstInvalid.focus();
      }
    } else {
      status.textContent = '';
    }
  });
})();
</script>

</body>
</html>
