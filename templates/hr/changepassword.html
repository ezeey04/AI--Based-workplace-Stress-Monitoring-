<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Password · Calmora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6FB;
    --surface:#FFFFFF;
    --ink:#2B2140;
    --ink-soft:#6B5F82;
    --teal:#6C3FC9;
    --teal-dark:#4B2A94;
    --sage:#B79CE8;
    --sage-soft:#F0E9FB;
    --coral:#E0457B;
    --coral-soft:#FCE7EF;
    --line:#E7DFF2;
    --ok:#1FB6A6;
    --ok-soft:#DBF6F1;
    --radius:16px;
    --navbar-h:64px;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:var(--navbar-h);}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(600px 300px at 90% -10%, var(--sage-soft), transparent),
      radial-gradient(500px 260px at -10% 110%, #FDF0CC, transparent),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:var(--navbar-h);
  }
  a{color:inherit; text-decoration:none;}
  a:focus-visible, button:focus-visible{outline:3px solid var(--sage); outline-offset:2px;}

  /* ---------- Nav bar ---------- */
  .navbar{
    background:var(--surface); border-bottom:1px solid var(--line);
    position:fixed; top:0; left:0; right:0; width:100%; height:var(--navbar-h); z-index:30;
  }
  .nav-inner{
    max-width:960px; margin:0 auto; padding:0 20px;
    height:var(--navbar-h); display:flex; align-items:center; gap:20px;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; color:var(--teal-dark); flex:none; }
  .brand-mark{
    width:26px;height:26px;border-radius:8px;
    background:linear-gradient(135deg,var(--teal),var(--sage));
    display:flex;align-items:center;justify-content:center;
  }
  .brand-mark svg{width:14px;height:14px;stroke:#fff;}

  .nav-links{ display:flex; align-items:center; gap:4px; flex:1; overflow-x:auto; scrollbar-width:none; }
  .nav-links::-webkit-scrollbar{ display:none; }
  .nav-links a{
    display:flex; align-items:center; gap:7px;
    font-size:13.5px; font-weight:600; color:var(--ink-soft);
    padding:8px 13px; border-radius:999px; white-space:nowrap;
    transition:background .15s ease, color .15s ease;
  }
  .nav-links a svg{ width:14px;height:14px; stroke:currentColor; flex:none; }
  .nav-links a:hover, .nav-links a.active{ background:var(--sage-soft); color:var(--teal-dark); }

  .nav-toggle{
    display:none; flex:none;
    width:36px;height:36px; border-radius:10px; border:1px solid var(--line);
    background:#fff; align-items:center; justify-content:center; cursor:pointer;
  }
  .nav-toggle svg{ width:17px;height:17px; stroke:var(--ink); }

  .nav-drawer{ display:none; }
  @media (max-width:720px){
    .nav-links{ display:none; }
    .nav-toggle{ display:flex; }
    .nav-drawer{
      display:none; flex-direction:column;
      max-width:960px; margin:0 auto; padding:0 20px 14px; gap:2px;
      position:fixed; top:64px; left:0; right:0;
      background:var(--surface); border-bottom:1px solid var(--line);
      max-height:calc(100vh - 64px); overflow-y:auto;
    }
    .nav-drawer.open{ display:flex; }
    .nav-drawer a{
      display:flex; align-items:center; gap:10px;
      font-size:14.5px; font-weight:600; color:var(--ink);
      padding:11px 12px; border-radius:11px;
    }
    .nav-drawer a svg{ width:16px;height:16px; stroke:var(--teal); flex:none; }
    .nav-drawer a:hover, .nav-drawer a.active{ background:var(--sage-soft); }
  }

  .wrap{ max-width:480px; margin:0 auto; padding:28px 20px 60px; }

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:22px;
    padding:36px 32px 32px;
    box-shadow:0 24px 48px -28px rgba(75,42,148,.28);
  }
  @media (max-width:520px){ .panel{ padding:28px 20px 24px; border-radius:18px; } }

  .panel-head{ margin-bottom:26px; text-align:center; }
  .panel-icon{
    width:52px; height:52px; border-radius:16px; margin:0 auto 16px;
    background:linear-gradient(135deg,var(--teal),var(--sage));
    display:flex; align-items:center; justify-content:center;
  }
  .panel-icon svg{ width:24px; height:24px; stroke:#fff; }
  .panel-head h1{
    font-family:'Fraunces',serif; font-weight:600; font-size:24px;
    margin:0 0 6px; color:var(--teal-dark);
  }
  .panel-head p{ margin:0; font-size:14px; color:var(--ink-soft); line-height:1.5; }

  form{ display:flex; flex-direction:column; gap:18px; }

  .field{ position:relative; display:flex; flex-direction:column; }
  .field label{ font-size:13px; font-weight:600; color:var(--ink); margin-bottom:7px; }
  .field label .req{ color:var(--coral); margin-left:2px; }

  .password-wrap{ position:relative; }
  .field input{
    width:100%;
    font-family:inherit; font-size:14.5px; color:var(--ink);
    background:#FBF9FD;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:12px 44px 12px 14px;
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
    appearance:none;
  }
  .toggle-visibility{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:32px; height:32px; border-radius:9px; border:none; background:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .toggle-visibility svg{ width:17px; height:17px; stroke:var(--ink-soft); }
  .toggle-visibility:hover svg{ stroke:var(--teal); }
  .toggle-visibility .eye-off{ display:none; }
  .toggle-visibility.showing .eye{ display:none; }
  .toggle-visibility.showing .eye-off{ display:block; }

  .field input:hover{ border-color:var(--sage); }
  .field input:focus{
    outline:none; border-color:var(--teal); background:#fff;
    box-shadow:0 0 0 4px var(--sage-soft);
  }

  .field.error input{
    border-color:var(--coral); background:var(--coral-soft);
  }
  .field.error input:focus{
    box-shadow:0 0 0 4px var(--coral-soft);
  }
  .field.valid input{ border-color:var(--ok); }

  .hint{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; }
  .error-msg{
    font-size:12.5px; color:var(--coral); margin-top:6px; font-weight:500;
    display:none; align-items:center; gap:5px;
  }
  .field.error .error-msg{ display:flex; }
  .error-msg svg{ width:13px;height:13px; stroke:var(--coral); flex:none; }

  .pw-meter{ display:flex; gap:4px; margin-top:8px; }
  .pw-meter span{ height:4px; flex:1; border-radius:2px; background:var(--line); transition:background .2s ease; }
  .pw-meter-label{ font-size:12px; color:var(--ink-soft); margin-top:5px; }

  .submit-row{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:6px; }
  button[type="submit"]{
    width:100%;
    font-family:inherit; font-weight:600; font-size:15px; color:#fff;
    background:linear-gradient(135deg,var(--teal),var(--teal-dark));
    border:none; border-radius:12px; padding:13px 26px;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 12px 24px -10px rgba(75,42,148,.55);
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  button[type="submit"]:hover{ transform:translateY(-2px); box-shadow:0 16px 30px -10px rgba(75,42,148,.6); }
  button[type="submit"]:active{ transform:translateY(0); }
  button[type="submit"] svg{ width:16px;height:16px; stroke:#fff; }
  .form-status{ font-size:13px; color:var(--coral); font-weight:600; text-align:center; }
</style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <div class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c2-4 4-6 6-6s3 8 6 8 4-6 6-6"/></svg>
        </span>
        Calmora
      </div>

      <div class="nav-links">
        <a href="/myapp/hrhome_get/">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
          Dashboard
        </a>
        <a href="/myapp/viewteamleader_get/">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5"/><path d="M9 4.5l3 3 3-3"/></svg>
          Team leaders
        </a>
        <a href="/myapp/viewteammember_get/">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Team members
        </a>
        <a href="/myapp/hrviewwork_get/">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-6 3 4 5-8"/></svg>
          Work
        </a>
      </div>

      <button type="button" class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>

    <div class="nav-drawer" id="navDrawer">
      <a href="/myapp/hrhome_get/">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
        Dashboard
      </a>
      <a href="/myapp/viewteamleader_get/">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5"/><path d="M9 4.5l3 3 3-3"/></svg>
        Team leaders
      </a>
      <a href="/myapp/viewteammember_get/">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Team members
      </a>
      <a href="/myapp/hrviewwork_get/">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-6 3 4 5-8"/></svg>
        Work
      </a>
    </div>
  </nav>

  <div class="wrap">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </span>
        <h1>Change password</h1>
        <p>Choose a new password to keep your account secure.</p>
      </div>

      <form action="/myapp/hrchangepassword_post/" method="post" id="pwForm" novalidate>
        {% csrf_token %}

        <div class="field" data-field="current">
          <label for="current">Current password<span class="req">*</span></label>
          <div class="password-wrap">
            <input type="password" id="current" name="current" placeholder="Enter current password" autocomplete="current-password">
            <button type="button" class="toggle-visibility" data-target="current" aria-label="Show password">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
            </button>
          </div>
          <span class="error-msg"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><span class="msg-text">Please enter your current password.</span></span>
        </div>

        <div class="field" data-field="new">
          <label for="new">New password<span class="req">*</span></label>
          <div class="password-wrap">
            <input type="password" id="new" name="new" placeholder="At least 8 characters" autocomplete="new-password">
            <button type="button" class="toggle-visibility" data-target="new" aria-label="Show password">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
            </button>
          </div>
          <div class="pw-meter"><span></span><span></span><span></span><span></span></div>
          <div class="pw-meter-label" id="pwMeterLabel"></div>
          <span class="error-msg"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><span class="msg-text">Use at least 8 characters.</span></span>
        </div>

        <div class="field" data-field="confirm">
          <label for="confirm">Confirm new password<span class="req">*</span></label>
          <div class="password-wrap">
            <input type="password" id="confirm" name="confirm" placeholder="Re-enter new password" autocomplete="new-password">
            <button type="button" class="toggle-visibility" data-target="confirm" aria-label="Show password">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
            </button>
          </div>
          <span class="error-msg"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><span class="msg-text">Passwords don't match.</span></span>
        </div>

        <div class="submit-row">
          <button type="submit">
            Change password
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          </button>
          <span class="form-status" id="formStatus"></span>
        </div>
      </form>
    </div>
  </div>

<script>
(function(){
  const navToggle = document.getElementById('navToggle');
  const navDrawer = document.getElementById('navDrawer');
  if(navToggle && navDrawer){
    navToggle.addEventListener('click', function(){
      const open = navDrawer.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }

  // Show/hide password toggles
  document.querySelectorAll('.toggle-visibility').forEach(function(btn){
    btn.addEventListener('click', function(){
      const input = document.getElementById(btn.getAttribute('data-target'));
      const showing = btn.classList.toggle('showing');
      input.type = showing ? 'text' : 'password';
      btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
    });
  });

  const form = document.getElementById('pwForm');
  const status = document.getElementById('formStatus');

  function setError(fieldEl, isError, customMsg){
    fieldEl.classList.toggle('error', isError);
    fieldEl.classList.toggle('valid', !isError);
    if(isError && customMsg){
      const msg = fieldEl.querySelector('.msg-text');
      if(msg) msg.textContent = customMsg;
    }
  }

  function validators(){
    const current = document.getElementById('current');
    const newPw = document.getElementById('new');
    const confirm = document.getElementById('confirm');

    return [
      { el: current, field: current.closest('.field'),
        test: () => current.value.length > 0 },
      { el: newPw, field: newPw.closest('.field'),
        test: () => newPw.value.length >= 8,
        msg: () => newPw.value.length === 0
          ? 'Please enter a new password.'
          : (newPw.value === current.value
              ? 'New password must be different from the current one.'
              : 'Use at least 8 characters.') },
      { el: confirm, field: confirm.closest('.field'),
        test: () => confirm.value.length > 0 && confirm.value === newPw.value },
    ];
  }

  function updatePasswordMeter(){
    const newPw = document.getElementById('new');
    const bars = newPw.closest('.field').querySelectorAll('.pw-meter span');
    const label = document.getElementById('pwMeterLabel');
    const v = newPw.value;
    let score = 0;
    if(v.length >= 8) score++;
    if(/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
    if(/[0-9]/.test(v)) score++;
    if(/[^A-Za-z0-9]/.test(v)) score++;
    const colors = ['var(--line)', 'var(--coral)', '#F2B705', '#3B6FD6', 'var(--ok)'];
    const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
    bars.forEach((b, i) => { b.style.background = i < score ? colors[score] : 'var(--line)'; });
    label.textContent = v.length > 0 ? labels[score] : '';
  }

  document.getElementById('new').addEventListener('input', updatePasswordMeter);

  // Also re-check "new" whenever "current" changes, since they must differ
  document.getElementById('current').addEventListener('input', function(){
    const newField = document.getElementById('new').closest('.field');
    if(newField.classList.contains('error')){
      const v = validators().find(x => x.el.id === 'new');
      setError(newField, !v.test(), v.msg ? v.msg() : undefined);
    }
  });

  validators().forEach(v => {
    const run = () => setError(v.field, !v.test(), v.msg ? v.msg() : undefined);
    v.el.addEventListener('blur', run);
    v.el.addEventListener('input', () => { if(v.field.classList.contains('error')) run(); });
  });

  form.addEventListener('submit', function(e){
    const checks = validators();
    let firstInvalid = null;
    let anyInvalid = false;

    checks.forEach(v => {
      const ok = v.test();
      setError(v.field, !ok, v.msg ? v.msg() : undefined);
      if(!ok){
        anyInvalid = true;
        if(!firstInvalid) firstInvalid = v.el;
      }
    });

    if(anyInvalid){
      e.preventDefault();
      status.textContent = 'Please fix the highlighted fields.';
      if(firstInvalid){
        firstInvalid.scrollIntoView({ behavior:'smooth', block:'center' });
        firstInvalid.focus();
      }
    } else {
      status.textContent = '';
    }
  });
})();
</script>

</body>
</html>
