<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add HR · Calmora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6FB;
    --surface:#FFFFFF;
    --ink:#2B2140;
    --ink-soft:#6B5F82;
    --teal:#6C3FC9;
    --teal-dark:#4B2A94;
    --sage:#B79CE8;
    --sage-soft:#F0E9FB;
    --coral:#E0457B;
    --line:#E7DFF2;
    --radius:18px;
    --err:#D8384F;
    --err-soft:#FCE6E9;

    --c1:#FF8B66; --c1-soft:#FFE8DE;
    --c2:#1FB6A6; --c2-soft:#DBF6F1;
    --c3:#F2B705; --c3-soft:#FDF0CC;
    --c4:#D6398C; --c4-soft:#FBE1EE;
    --c5:#3B6FD6; --c5-soft:#E2EAFB;
    --c6:#7CB518; --c6-soft:#ECF6D8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{text-decoration:none;color:inherit;}
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:3px solid var(--sage); outline-offset:2px;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    max-width:760px;
    margin:0 auto;
    padding:28px 24px 0;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:15px;
    font-weight:600;
    color:var(--teal-dark);
  }
  .brand-mark{
    width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg,var(--teal),var(--sage));
    display:flex;align-items:center;justify-content:center;
  }
  .brand-mark svg{width:16px;height:16px;stroke:#fff;}

  .back-link{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    font-weight:500;
    color:var(--ink-soft);
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:none;
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .back-link:hover{ color:var(--teal); border-color:var(--sage); background:var(--sage-soft); }
  .back-link svg{width:15px;height:15px;stroke:currentColor;}

  main{
    max-width:760px;
    margin:0 auto;
    padding:36px 24px 72px;
  }

  .page-head h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(26px,4vw,34px);
    margin:0 0 8px;
    color:var(--teal-dark);
  }
  .page-head p{
    margin:0 0 32px;
    color:var(--ink-soft);
    font-size:15px;
    max-width:480px;
  }

  form{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:32px;
  }

  .field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px 18px;
  }
  @media (max-width:560px){ .field-grid{ grid-template-columns:1fr; } }
  .field{ display:flex; flex-direction:column; }
  .field.full{ grid-column:1 / -1; }

  .field label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:8px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--dot,var(--teal));
    flex:none;
  }

  .field input[type=text],
  .field input[type=email],
  .field input[type=number],
  .field input[type=date],
  .field input[type=password],
  .field select{
    width:100%;
    padding:11px 13px;
    border:1.5px solid var(--line);
    border-radius:11px;
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    background:#FDFCFE;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus,
  .field select:focus{
    border-color:var(--teal);
    box-shadow:0 0 0 4px var(--sage-soft);
    outline:none;
  }
  .field.invalid input,
  .field.invalid select{
    border-color:var(--err);
    background:var(--err-soft);
  }

  .hint{
    margin-top:6px;
    font-size:12.5px;
    color:var(--ink-soft);
    min-height:16px;
  }
  .field.invalid .hint{ color:var(--err); font-weight:500; }

  /* file / photo upload */
  .upload{
    display:flex;
    align-items:center;
    gap:16px;
    border:1.5px dashed var(--line);
    border-radius:14px;
    padding:16px;
    background:#FDFCFE;
  }
  .upload-preview{
    width:56px;height:56px;
    border-radius:12px;
    background:var(--sage-soft);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    flex:none;
  }
  .upload-preview svg{ width:24px;height:24px; stroke:var(--teal); }
  .upload-preview img{ width:100%;height:100%;object-fit:cover; }
  .upload-text{ flex:1; }
  .upload-text .fname{ font-size:13.5px; font-weight:500; color:var(--ink); }
  .upload-text .fsub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .upload-btn{
    font-size:13px;
    font-weight:600;
    color:var(--teal-dark);
    background:var(--sage-soft);
    border:1px solid var(--sage);
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }
  .upload-btn:hover{ background:var(--sage); color:#fff; }
  input[type=file]{ display:none; }

  .submit-row{
    margin-top:28px;
    display:flex;
    align-items:center;
    gap:16px;
  }
  button.submit{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    color:#fff;
    background:linear-gradient(135deg,var(--teal),var(--teal-dark));
    padding:13px 28px;
    border-radius:999px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  button.submit:hover{ transform:translateY(-2px); box-shadow:0 12px 24px -12px rgba(75,42,148,.55); }
  button.submit:active{ transform:translateY(0); }
  .form-status{
    font-size:13.5px;
    color:var(--err);
    font-weight:500;
  }

  @media (prefers-reduced-motion:reduce){
    .back-link, button.submit, .field input, .field select{ transition:none; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c2-4 4-6 6-6s3 8 6 8 4-6 6-6"/></svg>
      </span>
      Calmora
    </div>
    <button type="button" class="back-link" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Back to dashboard
    </button>
  </div>

  <main>
    <div class="page-head">
      <h1>Add an HR manager</h1>
      <p>Fill in their details to give them access to the platform. Fields marked with a colored dot are required.</p>
    </div>

    <form id="addHrForm" action="/myapp/addhr_post/" method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      <div class="field-grid">

        <div class="field" data-field="name">
          <label for="name"><span class="dot" style="--dot:var(--c1)"></span>Name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Priya Nair" autocomplete="name">
          <div class="hint" data-hint></div>
        </div>

        <div class="field" data-field="email">
          <label for="email"><span class="dot" style="--dot:var(--c2)"></span>Email</label>
          <input type="email" id="email" name="email" placeholder="name@company.com" autocomplete="email">
          <div class="hint" data-hint></div>
        </div>

        <div class="field" data-field="phone">
          <label for="phone"><span class="dot" style="--dot:var(--c3)"></span>Phone</label>
          <input type="text" inputmode="numeric" id="phone" name="phone" placeholder="10-digit number" autocomplete="tel">
          <div class="hint" data-hint></div>
        </div>

        <div class="field" data-field="gender">
          <label for="gender"><span class="dot" style="--dot:var(--c4)"></span>Gender</label>
          <select name="gender" id="gender">
            <option value="" selected disabled>Select gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
          <div class="hint" data-hint></div>
        </div>

        <div class="field" data-field="dob">
          <label for="dob"><span class="dot" style="--dot:var(--c5)"></span>Date of birth</label>
          <input type="date" id="dob" name="dob" max="{{ dob }}">
          <div class="hint" data-hint></div>
        </div>

        <div class="field" data-field="qualification">
          <label for="qualification"><span class="dot" style="--dot:var(--c6)"></span>Qualification</label>
          <input type="text" id="qualification" name="qualification" placeholder="e.g. MBA in HR">
          <div class="hint" data-hint></div>
        </div>

        <div class="field full" data-field="photo">
          <label for="photo"><span class="dot" style="--dot:var(--c1)"></span>Photo</label>
          <div class="upload" id="uploadBox">
            <div class="upload-preview" id="uploadPreview">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-4 4-3-3-4 4"/></svg>
            </div>
            <div class="upload-text">
              <div class="fname" id="uploadName">No file selected</div>
              <div class="fsub">JPG or PNG, up to 2MB</div>
            </div>
            <button type="button" class="upload-btn" id="uploadBtn">Choose photo</button>
            <input type="file" id="photo" name="photo" accept="image/png, image/jpeg">
          </div>
          <div class="hint" data-hint></div>
        </div>

        <div class="field" data-field="password">
          <label for="password"><span class="dot" style="--dot:var(--c2)"></span>Password</label>
          <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password">
          <div class="hint" data-hint></div>
        </div>

        <div class="field" data-field="confirm">
          <label for="confirm"><span class="dot" style="--dot:var(--c3)"></span>Confirm password</label>
          <input type="password" id="confirm" name="confirm" placeholder="Re-enter password" autocomplete="new-password">
          <div class="hint" data-hint></div>
        </div>

      </div>

      <div class="submit-row">
        <button type="submit" class="submit">Add HR</button>
        <span class="form-status" id="formStatus"></span>
      </div>
    </form>
  </main>

<script>
(function(){
  const form = document.getElementById('addHrForm');
  const fields = {
    name: document.getElementById('name'),
    email: document.getElementById('email'),
    phone: document.getElementById('phone'),
    gender: document.getElementById('gender'),
    dob: document.getElementById('dob'),
    qualification: document.getElementById('qualification'),
    photo: document.getElementById('photo'),
    password: document.getElementById('password'),
    confirm: document.getElementById('confirm')
  };

  function fieldWrap(name){ return form.querySelector('[data-field="'+name+'"]'); }
  function setError(name, message){
    const wrap = fieldWrap(name);
    wrap.classList.add('invalid');
    wrap.querySelector('[data-hint]').textContent = message;
  }
  function clearError(name){
    const wrap = fieldWrap(name);
    wrap.classList.remove('invalid');
    wrap.querySelector('[data-hint]').textContent = '';
  }

  function validateName(){
    const v = fields.name.value.trim();
    if(!v){ setError('name','Enter the HR manager\'s name.'); return false; }
    if(!/^[A-Za-z ]{2,}$/.test(v)){ setError('name','Use letters and spaces only.'); return false; }
    clearError('name'); return true;
  }
  function validateEmail(){
    const v = fields.email.value.trim();
    if(!v){ setError('email','Enter an email address.'); return false; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ setError('email','Enter a valid email address.'); return false; }
    clearError('email'); return true;
  }
  function validatePhone(){
    const v = fields.phone.value.trim();
    if(!v){ setError('phone','Enter a phone number.'); return false; }
    if(!/^[0-9]{10}$/.test(v)){ setError('phone','Enter exactly 10 digits, no spaces.'); return false; }
    clearError('phone'); return true;
  }
  function validateGender(){
    if(!fields.gender.value){ setError('gender','Select a gender.'); return false; }
    clearError('gender'); return true;
  }
  function validateDob(){
    const v = fields.dob.value;
    if(!v){ setError('dob','Select a date of birth.'); return false; }
    const dob = new Date(v);
    const today = new Date();
    let age = today.getFullYear() - dob.getFullYear();
    const m = today.getMonth() - dob.getMonth();
    if(m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
    if(dob > today){ setError('dob','Date of birth can\'t be in the future.'); return false; }
    if(age < 18){ setError('dob','HR managers must be at least 18.'); return false; }
    clearError('dob'); return true;
  }
  function validateQualification(){
  const v = fields.qualification.value.trim();
  if(!v){
    setError('qualification','Enter a qualification.');
    return false;
  }
  if(!/^[A-Za-z .,()]+$/.test(v)){
    setError('qualification','Use letters, numbers, spaces, dots, commas, and parentheses only.');
    return false;
  }
  if(v.length < 2){
    setError('qualification','Qualification must be at least 2 characters.');
    return false;
  }
  clearError('qualification');
  return true;
}
  function validatePhoto(){
    const f = fields.photo.files[0];
    if(!f){ setError('photo','Upload a photo.'); return false; }
    if(!['image/jpeg','image/png'].includes(f.type)){ setError('photo','Only JPG or PNG files are allowed.'); return false; }
    if(f.size > 2*1024*1024){ setError('photo','Keep the file under 2MB.'); return false; }
    clearError('photo'); return true;
  }
  function validatePassword(){
    const v = fields.password.value;
    if(!v){ setError('password','Enter a password.'); return false; }
    if(v.length < 8){ setError('password','Use at least 8 characters.'); return false; }
    clearError('password');
    if(fields.confirm.value) validateConfirm();
    return true;
  }
  function validateConfirm(){
    const v = fields.confirm.value;
    if(!v){ setError('confirm','Re-enter the password.'); return false; }
    if(v !== fields.password.value){ setError('confirm','Passwords don\'t match.'); return false; }
    clearError('confirm'); return true;
  }

  fields.name.addEventListener('input', validateName);
  fields.email.addEventListener('input', validateEmail);
  fields.phone.addEventListener('input', function(){
    fields.phone.value = fields.phone.value.replace(/[^0-9]/g,'').slice(0,10);
    validatePhone();
  });
  fields.gender.addEventListener('change', validateGender);
  fields.dob.addEventListener('change', validateDob);
  fields.qualification.addEventListener('input', validateQualification);
  fields.password.addEventListener('input', validatePassword);
  fields.confirm.addEventListener('input', validateConfirm);

  // photo upload UI
  const uploadBtn = document.getElementById('uploadBtn');
  const uploadName = document.getElementById('uploadName');
  const uploadPreview = document.getElementById('uploadPreview');
  uploadBtn.addEventListener('click', () => fields.photo.click());
  fields.photo.addEventListener('change', function(){
    validatePhoto();
    const f = fields.photo.files[0];
    if(f){
      uploadName.textContent = f.name;
      const reader = new FileReader();
      reader.onload = e => { uploadPreview.innerHTML = '<img src="'+e.target.result+'" alt="">'; };
      if(['image/jpeg','image/png'].includes(f.type)) reader.readAsDataURL(f);
    } else {
      uploadName.textContent = 'No file selected';
    }
  });

  form.addEventListener('submit', function(e){
    const checks = [validateName(), validateEmail(), validatePhone(), validateGender(),
                     validateDob(), validateQualification(), validatePhoto(),
                     validatePassword(), validateConfirm()];
    const allValid = checks.every(Boolean);
    const status = document.getElementById('formStatus');
    if(!allValid){
      e.preventDefault();
      status.textContent = 'Please fix the highlighted fields.';
      const firstInvalid = form.querySelector('.invalid input, .invalid select, .invalid .upload-btn');
      if(firstInvalid) firstInvalid.focus();
    } else {
      status.textContent = '';
    }
  });
})();
</script>

</body>
</html>
