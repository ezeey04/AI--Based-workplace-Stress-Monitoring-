<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Password · Calmora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6FB;
    --surface:#FFFFFF;
    --ink:#2B2140;
    --ink-soft:#6B5F82;
    --teal:#6C3FC9;
    --teal-dark:#4B2A94;
    --sage:#B79CE8;
    --sage-soft:#F0E9FB;
    --coral:#E0457B;
    --line:#E7DFF2;
    --radius:18px;
    --err:#D8384F;
    --err-soft:#FCE6E9;
    --ok:#4C9A4C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{text-decoration:none;color:inherit;}
  a:focus-visible, button:focus-visible, input:focus-visible{ outline:3px solid var(--sage); outline-offset:2px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    max-width:480px; margin:0 auto; padding:28px 24px 0;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-size:15px; font-weight:600; color:var(--teal-dark); }
  .brand-mark{
    width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg,var(--teal),var(--sage));
    display:flex;align-items:center;justify-content:center;
  }
  .brand-mark svg{width:16px;height:16px;stroke:#fff;}
  .back-link{
    display:flex; align-items:center; gap:6px; font-size:14px; font-weight:500; color:var(--ink-soft);
    padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:none; cursor:pointer;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .back-link:hover{ color:var(--teal); border-color:var(--sage); background:var(--sage-soft); }
  .back-link svg{width:15px;height:15px;stroke:currentColor;}

  main{ max-width:480px; margin:0 auto; padding:36px 24px 72px; }

  .page-head h1{
    font-family:'Fraunces',serif; font-weight:500; font-size:clamp(24px,5vw,30px);
    margin:0 0 8px; color:var(--teal-dark);
  }
  .page-head p{ margin:0 0 28px; color:var(--ink-soft); font-size:14.5px; }

  form{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:28px;
  }

  .field{ display:flex; flex-direction:column; margin-bottom:20px; }
  .field:last-of-type{ margin-bottom:0; }

  .field label{
    font-size:13.5px; font-weight:600; color:var(--ink); margin-bottom:8px;
  }

  .input-wrap{ position:relative; }
  .field input[type=password],
  .field input[type=text]{
    width:100%; padding:11px 42px 11px 13px; border:1.5px solid var(--line); border-radius:11px;
    font-family:inherit; font-size:14.5px; color:var(--ink); background:#FDFCFE;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus{ border-color:var(--teal); box-shadow:0 0 0 4px var(--sage-soft); outline:none; }
  .field.invalid input{ border-color:var(--err); background:var(--err-soft); }

  .toggle-vis{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:30px;height:30px; border:none; background:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; border-radius:8px;
    color:var(--ink-soft);
  }
  .toggle-vis:hover{ background:var(--sage-soft); color:var(--teal); }
  .toggle-vis svg{ width:17px;height:17px; stroke:currentColor; }

  .hint{ margin-top:6px; font-size:12.5px; color:var(--ink-soft); min-height:16px; }
  .field.invalid .hint{ color:var(--err); font-weight:500; }

  .strength{
    display:flex; gap:5px; margin-top:9px;
  }
  .strength i{
    flex:1; height:4px; border-radius:3px; background:var(--line); font-style:normal;
    transition:background .15s ease;
  }
  .strength-label{ font-size:12px; color:var(--ink-soft); margin-top:6px; }

  .submit-row{ margin-top:26px; display:flex; flex-direction:column; gap:12px; }
  button.submit{
    appearance:none; border:none; cursor:pointer; font-family:inherit;
    font-size:15px; font-weight:600; color:#fff;
    background:linear-gradient(135deg,var(--teal),var(--teal-dark));
    padding:13px 20px; border-radius:999px; width:100%;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  button.submit:hover{ transform:translateY(-2px); box-shadow:0 12px 24px -12px rgba(75,42,148,.55); }
  button.submit:active{ transform:translateY(0); }
  .form-status{ font-size:13.5px; color:var(--err); font-weight:500; text-align:center; }

  @media (prefers-reduced-motion:reduce){
    .back-link, button.submit, .field input{ transition:none; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c2-4 4-6 6-6s3 8 6 8 4-6 6-6"/></svg>
      </span>
      Calmora
    </div>
    <button type="button" class="back-link" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Back
    </button>
  </div>

  <main>
    <div class="page-head">
      <h1>Change password</h1>
      <p>Use something you don't use anywhere else.</p>
    </div>

    <form id="pwForm" action="/myapp/adminchangepassword_post/" method="post" novalidate>
      {% csrf_token %}

      <div class="field" data-field="current">
        <label for="current">Current password</label>
        <div class="input-wrap">
          <input type="password" id="current" name="current" autocomplete="current-password">
          <button type="button" class="toggle-vis" data-target="current" aria-label="Show current password">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="hint" data-hint></div>
      </div>

      <div class="field" data-field="new">
        <label for="new">New password</label>
        <div class="input-wrap">
          <input type="password" id="new" name="new" autocomplete="new-password">
          <button type="button" class="toggle-vis" data-target="new" aria-label="Show new password">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="strength" id="strengthBars">
          <i></i><i></i><i></i><i></i>
        </div>
        <div class="strength-label" id="strengthLabel"></div>
        <div class="hint" data-hint></div>
      </div>

      <div class="field" data-field="confirm">
        <label for="confirm">Confirm new password</label>
        <div class="input-wrap">
          <input type="password" id="confirm" name="confirm" autocomplete="new-password">
          <button type="button" class="toggle-vis" data-target="confirm" aria-label="Show confirm password">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="hint" data-hint></div>
      </div>

      <div class="submit-row">
        <button type="submit" class="submit">Change password</button>
        <span class="form-status" id="formStatus"></span>
      </div>
    </form>
  </main>

<script>
(function(){
  const form = document.getElementById('pwForm');
  const fields = {
    current: document.getElementById('current'),
    new: document.getElementById('new'),
    confirm: document.getElementById('confirm')
  };

  function fieldWrap(name){ return form.querySelector('[data-field="'+name+'"]'); }
  function setError(name, message){
    const wrap = fieldWrap(name);
    wrap.classList.add('invalid');
    wrap.querySelector('[data-hint]').textContent = message;
  }
  function clearError(name){
    const wrap = fieldWrap(name);
    wrap.classList.remove('invalid');
    wrap.querySelector('[data-hint]').textContent = '';
  }

  function validateCurrent(){
    if(!fields.current.value){ setError('current','Enter your current password.'); return false; }
    clearError('current'); return true;
  }

  function scorePassword(v){
    let score = 0;
    if(v.length >= 8) score++;
    if(v.length >= 12) score++;
    if(/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
    if(/[0-9]/.test(v) && /[^A-Za-z0-9]/.test(v)) score++;
    return score; // 0-4
  }
  function paintStrength(score){
    const bars = document.querySelectorAll('#strengthBars i');
    const label = document.getElementById('strengthLabel');
    const colors = ['var(--err)','var(--err)','#E0A63E','var(--ok)','var(--ok)'];
    const labels = ['','Weak','Fair','Good','Strong'];
    bars.forEach((bar,i) => { bar.style.background = i < score ? colors[score] : 'var(--line)'; });
    label.textContent = fields.new.value ? labels[score] : '';
    label.style.color = colors[score];
  }

  function validateNew(){
    const v = fields.new.value;
    const score = scorePassword(v);
    paintStrength(score);
    if(!v){ setError('new','Enter a new password.'); return false; }
    if(v.length < 8){ setError('new','Use at least 8 characters.'); return false; }
    if(fields.current.value && v === fields.current.value){ setError('new','Choose a password different from your current one.'); return false; }
    clearError('new');
    if(fields.confirm.value) validateConfirm();
    return true;
  }
  function validateConfirm(){
    const v = fields.confirm.value;
    if(!v){ setError('confirm','Re-enter the new password.'); return false; }
    if(v !== fields.new.value){ setError('confirm','Passwords don\'t match.'); return false; }
    clearError('confirm'); return true;
  }

  fields.current.addEventListener('input', validateCurrent);
  fields.new.addEventListener('input', validateNew);
  fields.confirm.addEventListener('input', validateConfirm);

  document.querySelectorAll('.toggle-vis').forEach(btn => {
    btn.addEventListener('click', function(){
      const input = document.getElementById(btn.dataset.target);
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });
  });

  form.addEventListener('submit', function(e){
    const checks = [validateCurrent(), validateNew(), validateConfirm()];
    const allValid = checks.every(Boolean);
    const status = document.getElementById('formStatus');
    if(!allValid){
      e.preventDefault();
      status.textContent = 'Please fix the highlighted fields.';
      const firstInvalid = form.querySelector('.invalid input');
      if(firstInvalid) firstInvalid.focus();
    } else {
      status.textContent = '';
    }
  });
})();
</script>

</body>
</html>
